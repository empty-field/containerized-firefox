version: '3.8'

services:
  firefox:
    image: firefox-esr-f:latest
    userns_mode: "keep-id"
    shm_size: "2gb"
    restart: "no"
    security_opt:
      - apparmor=unconfined
    command: ["firefox-esr"]
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.Xauthority
      - PULSE_SERVER=unix:/run/user/${HOST_UID:-1000}/pulse/native
      - XDG_RUNTIME_DIR=/run/user/${HOST_UID:-1000}
    volumes:
      # X11
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro

      # Profile and downloads
      - ./firefox-profile:/home/firefox/.mozilla
      - ./downloads:/home/firefox/Downloads

      # PipeWire / PulseAudio
      - /run/user/${HOST_UID:-1000}/pulse:/run/user/${HOST_UID:-1000}/pulse:ro
      - /run/user/${HOST_UID:-1000}/pipewire-0:/run/user/${HOST_UID:-1000}/pipewire-0:ro

      - /dev/shm:/dev/shm
